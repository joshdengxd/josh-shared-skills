<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 760" width="1190" height="760" role="img" aria-label="Delivery cycle: refine, build and evaluate, ship, investigate with data, foundations">
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2328" flood-opacity="0.10"/></filter><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F8FA"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F6FEB"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0E8A8A"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2EA44F"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B4FBB"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E36209"/></marker></defs>
<rect x="0.5" y="0.5" width="1189" height="759" rx="18" fill="url(#bg)" stroke="#D0D7DE"/>
<text x="40" y="48" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f2328">Delivery cycle</text>
<text x="40" y="72" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">From a vague ticket to a production release. Independent agents check the work. A human takes every irreversible step.</text>
<rect x="40" y="100" width="200" height="300" rx="14" fill="#FFF8F0" stroke="#E36209" stroke-opacity="0.35"/>
<circle cx="66" cy="128" r="12" fill="#E36209"/><text x="66" y="133" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="86" y="133" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#E36209">REFINE</text>
<rect x="270" y="100" width="420" height="300" rx="14" fill="#F3F8FF" stroke="#1F6FEB" stroke-opacity="0.35"/>
<circle cx="296" cy="128" r="12" fill="#1F6FEB"/><text x="296" y="133" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="316" y="133" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#1F6FEB">BUILD, EVALUATE, IMPROVE</text>
<rect x="720" y="100" width="430" height="300" rx="14" fill="#F8F4FF" stroke="#6B4FBB" stroke-opacity="0.35"/>
<circle cx="746" cy="128" r="12" fill="#6B4FBB"/><text x="746" y="133" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="766" y="133" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#6B4FBB">SHIP</text>
<rect x="60" y="150" width="160" height="34" rx="17" fill="#fff" stroke="#E36209" stroke-dasharray="4 3"/><text x="140" y="172" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Epic / feature</text>
<rect x="60" y="194" width="160" height="34" rx="17" fill="#fff" stroke="#E36209" stroke-dasharray="4 3"/><text x="140" y="216" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Spec: agent drafts</text>
<rect x="60" y="238" width="160" height="34" rx="17" fill="#fff" stroke="#E36209" stroke-dasharray="4 3"/><text x="140" y="260" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Tickets: breakdown</text>
<path d="M140 184 L140 192" fill="none" stroke="#E36209" stroke-width="1.6"  marker-end="url(#ao)"/>
<path d="M140 228 L140 236" fill="none" stroke="#E36209" stroke-width="1.6"  marker-end="url(#ao)"/>
<path d="M140 272 L140 296" fill="none" stroke="#E36209" stroke-width="1.6"  marker-end="url(#ao)"/>
<rect x="60" y="298" width="160" height="64" rx="10" fill="#fff" stroke="#E36209" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="61" y="308" width="4" height="44" rx="2" fill="#E36209"/>
<text x="78" y="322" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">ticket-refine</text>
<text x="78" y="340" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Spec + criteria</text>
<text x="78" y="355" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">User approves draft</text>
<text x="140" y="386" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#E36209" text-anchor="middle">dashed: process, no skill yet</text>
<rect x="290" y="156" width="380" height="58" rx="10" fill="#fff" stroke="#1F6FEB" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="291" y="166" width="4" height="38" rx="2" fill="#1F6FEB"/>
<text x="308" y="180" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">implement-with-score-gate</text>
<text x="308" y="198" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Worktree, implement, fresh subagent scores 0-10</text>
<rect x="290" y="230" width="380" height="58" rx="10" fill="#fff" stroke="#1F6FEB" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="291" y="240" width="4" height="38" rx="2" fill="#1F6FEB"/>
<text x="308" y="254" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">verify-against-criteria</text>
<text x="308" y="272" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Post-task hook: read-only verdict + evidence</text>
<rect x="290" y="304" width="380" height="58" rx="10" fill="#fff" stroke="#1F6FEB" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="291" y="314" width="4" height="38" rx="2" fill="#1F6FEB"/>
<text x="308" y="328" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">live-env-local-test</text>
<text x="308" y="346" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Post-task hook: real environment, local build</text>
<path d="M220 330 C255 330 255 185 288 185" fill="none" stroke="#E36209" stroke-width="1.6"  marker-end="url(#ao)"/>
<path d="M670 259 L682 259 L682 185 L672 185" fill="none" stroke="#1F6FEB" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ab)"/>
<text x="530" y="386" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1F6FEB" text-anchor="middle">not passing: findings go back, new scorer each round</text>
<rect x="740" y="156" width="390" height="44" rx="22" fill="#6B4FBB" filter="url(#sh)"/><text x="935" y="183" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">You review and merge the PR</text>
<rect x="740" y="224" width="185" height="64" rx="10" fill="#fff" stroke="#6B4FBB" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="741" y="234" width="4" height="44" rx="2" fill="#6B4FBB"/>
<text x="758" y="248" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">deploy-to-staging</text>
<text x="758" y="266" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Explicit tag, GitOps sync</text>
<text x="758" y="281" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">You confirm</text>
<rect x="945" y="224" width="185" height="64" rx="10" fill="#fff" stroke="#6B4FBB" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="946" y="234" width="4" height="44" rx="2" fill="#6B4FBB"/>
<text x="963" y="248" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">prod-release-gate</text>
<text x="963" y="266" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Stop after each step</text>
<text x="963" y="281" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">Canary go / no-go</text>
<path d="M670 333 C710 333 710 178 738 178" fill="none" stroke="#1F6FEB" stroke-width="1.6"  marker-end="url(#ab)"/>
<text x="712" y="320" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1F6FEB" text-anchor="start">PASS</text>
<path d="M935 200 L835 222" fill="none" stroke="#6B4FBB" stroke-width="1.6"  marker-end="url(#ap)"/>
<path d="M925 256 L943 256" fill="none" stroke="#6B4FBB" stroke-width="1.6"  marker-end="url(#ap)"/>
<text x="935" y="330" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a" text-anchor="middle">Production actions are always done by a human.</text>
<rect x="270" y="420" width="420" height="84" rx="14" fill="#F1FAFA" stroke="#0E8A8A" stroke-opacity="0.45"/>
<circle cx="296" cy="448" r="12" fill="#0E8A8A"/><text x="296" y="453" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="316" y="453" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#0E8A8A">RUN IT AT SCALE</text>
<text x="290" y="478" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">issue-batch-drain</text>
<text x="290" y="496" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">One group at a time: fresh implementer, then fresh verifier</text>
<path d="M480 418 L480 402" fill="none" stroke="#0E8A8A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#at)"/>
<text x="492" y="413" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0E8A8A" text-anchor="start">each group runs box 2</text>
<rect x="40" y="530" width="1110" height="84" rx="14" fill="#F3FBF4" stroke="#2EA44F" stroke-opacity="0.35"/>
<circle cx="66" cy="558" r="12" fill="#2EA44F"/><text x="66" y="563" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="86" y="563" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#2EA44F">INVESTIGATE WITH DATA</text>
<rect x="60" y="566" width="250" height="38" rx="10" fill="#fff" stroke="#2EA44F" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="61" y="576" width="4" height="18" rx="2" fill="#2EA44F"/>
<text x="78" y="590.0" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">log-analysis</text>
<text x="330" y="591" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#57606a">debug  ·  size a change  ·  check an assumption  ·  evidence for a proposal  ·  baseline  ·  monitor  ·  A/B tests</text>
<path d="M140 530 L140 402" fill="none" stroke="#2EA44F" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<text x="152" y="470" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2EA44F" text-anchor="start">evidence for specs and design</text>
<path d="M935 530 L935 402" fill="none" stroke="#2EA44F" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<text x="947" y="470" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2EA44F" text-anchor="start">canary and debugging</text>
<path d="M1060 402 L1060 528" fill="none" stroke="#2EA44F" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<text x="1072" y="470" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2EA44F" text-anchor="start">monitor, A/B results</text>
<rect x="40" y="640" width="1110" height="84" rx="14" fill="#F6F8FA" stroke="#57606a" stroke-opacity="0.35"/>
<circle cx="66" cy="668" r="12" fill="#57606a"/><text x="66" y="673" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="86" y="673" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#57606a">FOUNDATIONS</text>
<rect x="60" y="676" width="150" height="38" rx="10" fill="#fff" stroke="#57606a" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="61" y="686" width="4" height="18" rx="2" fill="#57606a"/>
<text x="78" y="700.0" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">wrap-up</text>
<rect x="226" y="676" width="270" height="38" rx="10" fill="#fff" stroke="#57606a" stroke-opacity="0.55" filter="url(#sh)"/>
<rect x="227" y="686" width="4" height="18" rx="2" fill="#57606a"/>
<text x="244" y="700.0" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2328">agent-context-template</text>
<text x="516" y="701" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#57606a">every session ends with what worked saved as memory; every repo starts with the right rules</text>
</svg>